services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/jellyfederation:cached
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    environment:
      Database__Provider: PostgreSQL
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=jellyfederation;Username=jellyfederation;Password=jellyfederation
      Telemetry__OtlpEndpoint: http://lgtm:4317
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: jellyfederation
      POSTGRES_USER: jellyfederation
      POSTGRES_PASSWORD: jellyfederation
    ports:
      - "5432:5432"
    volumes:
      - jellyfederation-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jellyfederation -d jellyfederation"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    profiles: ["db-tools", "full-stack"]
    image: adminer:5-standalone@sha256:04ccdec4f899b92650855e9e8ad2f4099987f1b348fdad9b44d345ad38e1e54b
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  lgtm:
    profiles: ["observability", "full-stack"]
    image: grafana/otel-lgtm:latest@sha256:1b852b77d7bcadb7699bfe7c78a51d059dff85168de674728cf7abf4474645e5
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

volumes:
  jellyfederation-postgres-data:
