services:
  jellyfederation-server:
    profiles: ["full-stack"]
    build:
      context: ..
      dockerfile: src/JellyFederation.Server/Dockerfile
    environment:
      Database__Provider: PostgreSQL
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=jellyfederation;Username=jellyfederation;Password=jellyfederation
      Telemetry__OtlpEndpoint: http://lgtm:4317
      Urls: http://0.0.0.0:5264
    ports:
      - "5264:5264"
    depends_on:
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_started

  jellyfederation-web:
    profiles: ["full-stack"]
    image: node:24.16.0-alpine@sha256:fb71d01345f11b708a3553c66e7c74074f2d506400ea81973343d915cb64eef0
    working_dir: /workspace/src/JellyFederation.Web
    volumes:
      - ..:/workspace:cached
    command: sh -lc "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      jellyfederation-server:
        condition: service_started

  jellyfin:
    profiles: ["full-stack"]
    image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - jellyfin-media:/media

volumes:
  jellyfin-config:
  jellyfin-cache:
  jellyfin-media:
