services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/jellyfederation:cached
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    environment:
      Database__Provider: PostgreSQL
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=jellyfederation;Username=jellyfederation;Password=jellyfederation
      Telemetry__OtlpEndpoint: http://lgtm:4317
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    restart: unless-stopped
    environment:
      POSTGRES_DB: jellyfederation
      POSTGRES_USER: jellyfederation
      POSTGRES_PASSWORD: jellyfederation
    ports:
      - "5432:5432"
    volumes:
      - jellyfederation-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jellyfederation -d jellyfederation"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    profiles: ["db-tools", "full-stack"]
    image: adminer:5-standalone@sha256:f8b53921bc7c20a7ed05ec2f9d278d8e6f983d65cad65bf0b4d9216dd7a1a96a
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  lgtm:
    profiles: ["observability", "full-stack"]
    image: grafana/otel-lgtm:latest@sha256:2e3290657f2f2a256c7a9175f097424a3ac5b54840741ace433e108e109348b6
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

volumes:
  jellyfederation-postgres-data:
