services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/jellyfederation:cached
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    environment:
      Database__Provider: PostgreSQL
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=jellyfederation;Username=jellyfederation;Password=jellyfederation
      Telemetry__OtlpEndpoint: http://lgtm:4317
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_DB: jellyfederation
      POSTGRES_USER: jellyfederation
      POSTGRES_PASSWORD: jellyfederation
    ports:
      - "5432:5432"
    volumes:
      - jellyfederation-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jellyfederation -d jellyfederation"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    profiles: ["db-tools", "full-stack"]
    image: adminer:5-standalone@sha256:87f9aeeef91638f5bc150bb6490a4fd85d071f458f38dcc8171a640e1751d29b
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  lgtm:
    profiles: ["observability", "full-stack"]
    image: grafana/otel-lgtm:latest@sha256:75cdf892daffadf3763ef61c16a6d7f8586216fce0b40bba7874a0b053121084
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

volumes:
  jellyfederation-postgres-data:
