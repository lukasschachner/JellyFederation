services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/jellyfederation:cached
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    environment:
      Database__Provider: PostgreSQL
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=jellyfederation;Username=jellyfederation;Password=jellyfederation
      Telemetry__OtlpEndpoint: http://lgtm:4317
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
    restart: unless-stopped
    environment:
      POSTGRES_DB: jellyfederation
      POSTGRES_USER: jellyfederation
      POSTGRES_PASSWORD: jellyfederation
    ports:
      - "5432:5432"
    volumes:
      - jellyfederation-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jellyfederation -d jellyfederation"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    profiles: ["db-tools", "full-stack"]
    image: adminer:5-standalone@sha256:af4b73ddc41b7f7bb5e614eef1f35ba998307be2c8d1c54bf4890e8b946c6e67
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  lgtm:
    profiles: ["observability", "full-stack"]
    image: grafana/otel-lgtm:latest@sha256:10f48eb2f8670134df542177bb19536c55421b089e43f9dfc2a27d4c078204d8
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

volumes:
  jellyfederation-postgres-data:
