services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/jellyfederation:cached
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    environment:
      Database__Provider: PostgreSQL
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=jellyfederation;Username=jellyfederation;Password=jellyfederation
      Telemetry__OtlpEndpoint: http://lgtm:4317
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    restart: unless-stopped
    environment:
      POSTGRES_DB: jellyfederation
      POSTGRES_USER: jellyfederation
      POSTGRES_PASSWORD: jellyfederation
    ports:
      - "5432:5432"
    volumes:
      - jellyfederation-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jellyfederation -d jellyfederation"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    profiles: ["db-tools", "full-stack"]
    image: adminer:5-standalone@sha256:58e9a9a7674af064c9b0e00041f53eb390f76f446303c53224529d93cf1c713e
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  lgtm:
    profiles: ["observability", "full-stack"]
    image: grafana/otel-lgtm:latest@sha256:72e05804790e6e0d8c0b70a6d5ff1f721ef7b203463374631e99aa3429bd0cf6
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

volumes:
  jellyfederation-postgres-data:
